apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'com.facebook.react'

android {
    namespace 'com.zerolist'
    compileSdkVersion rootProject.ext.compileSdkVersion
    ndkVersion rootProject.ext.ndkVersion
    defaultConfig {
        ndk { abiFilters(*((project.findProperty('reactNativeArchitectures') ?: 'arm64-v8a,x86_64').split(','))) }
        minSdkVersion rootProject.ext.minSdkVersion
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_shared' } }
    }
    externalNativeBuild { cmake { path 'src/main/jni/CMakeLists.txt' } }
    sourceSets { main { java.srcDirs += ['generated/java'] } }
}
react {
    jsRootDir = file('../src')
    libraryName = 'ZerolistSpec'
    codegenJavaPackageName = 'com.zerolist'
}
dependencies { implementation 'com.facebook.react:react-android' }
