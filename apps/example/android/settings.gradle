pluginManagement {
  def rn = new File(providers.exec {
    workingDir(rootDir.parentFile)
    commandLine("node", "--print", "require.resolve('react-native/package.json')")
  }.standardOutput.asText.get().trim()).parentFile
  def plugin = new File(providers.exec {
    workingDir(rn)
    commandLine("node", "--print", "require.resolve('@react-native/gradle-plugin/package.json')")
  }.standardOutput.asText.get().trim()).parentFile
  includeBuild(plugin.absolutePath)
}
plugins { id("com.facebook.react.settings") }
extensions.configure(com.facebook.react.ReactSettingsExtension){ ex -> ex.autolinkLibrariesFromCommand() }
rootProject.name = 'zerolist.example'
include ':app'
def rn = new File(providers.exec {
  workingDir(rootDir.parentFile)
  commandLine("node", "--print", "require.resolve('react-native/package.json')")
}.standardOutput.asText.get().trim()).parentFile
includeBuild(new File(providers.exec {
  workingDir(rn)
  commandLine("node", "--print", "require.resolve('@react-native/gradle-plugin/package.json')")
}.standardOutput.asText.get().trim()).parentFile)
